name: CrownDash
options:
  bundleIdPrefix: com.bradleyvirtual
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupOrdering:
    - order: [CrownDash]

targets:
  CrownDash:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CrownDash
        excludes:
          - "**/.DS_Store"
    resources:
      - path: CrownDash/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: CrownDash
        PRODUCT_BUNDLE_IDENTIFIER: com.bradleyvirtual.crowndash
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: CrownDash/Info.plist
        CODE_SIGN_ENTITLEMENTS: CrownDash/CrownDash.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: "4SQJ3AH62S"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
